<body>
<div id="root">
  <div class="boot"><div class="boot-inner">
    <div class="boot-mark">桜</div>
    <div class="boot-title">Sakura Village</div>
    <div class="boot-sub" id="boot-status">waking the valley…</div>
    <div class="boot-steps" id="bootSteps"></div>
  </div></div>
</div>

<script type="module">
/* ============================================================
   SAKURA VILLAGE — boot loader
   1. load three.js (jsDelivr → unpkg → esm.sh, 10s timeout each)
   2. load the five game files in order (classic scripts, so this
      all works when opened directly from disk — no server needed)
   3. every step is checked; a failure names the exact file
   ============================================================ */
const statusEl = document.getElementById('boot-status');
const stepsEl = document.getElementById('bootSteps');
const STEPS = ['engine', 'world', 'characters', 'systems', 'interface', 'start'];
let bootErr = null;
window.addEventListener('error', (e) => {
  if (!bootErr){
    if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) bootErr = 'could not load ' + e.target.src.split('/').pop();
    else bootErr = e.message || 'unknown error';
  }
}, true);
function renderSteps(done, bad){
  stepsEl.innerHTML = STEPS.map((s, i) =>
    `<div class="${i < done ? 'ok' : (i === done && bad ? 'bad' : '')}">${i < done ? '✓ ' : ''}${s}${i === done && bad ? ' ✗' : ''}</div>`
  ).join('');
}
function showBootFailure(lines){ (initial commit: sakura game with full code and readme)
  const esc = (s) => String(s).replace(/</g, '&lt;');
  document.getElementById('root').innerHTML = `
    <div class="boot"><div class="boot-inner">
      <div class="boot-mark">桜</div>
      <div class="boot-title">Sakura Village</div>
      <div class="boot-sub">could not start</div>
      <div class="boot-error">
        ${lines.map(l => `<div>${esc(l)}</div>`).join('')}
        <div>All six files must sit in the same folder: index.html, sv-world.js, sv-entities.js,
        sv-systems.js, sv-ui.js, sv-main.js. Press F12 → Console for the detailed error.</div>
      </div>
      <div class="boot-tip">If a file was copied incompletely, re-copy just that one file —
      the list above tells you which step failed.</div> (initial commit: sakura game with full code and readme)
    </div></div>`;
}
const ENGINE_CDNS = [
  ['jsDelivr', 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js'],
  ['unpkg',    'https://unpkg.com/three@0.160.1/build/three.module.js'],
  ['esm.sh',   'https://esm.sh/three@0.160.1'],
];
let THREE = null;
const failures = [];
for (const [name, url] of ENGINE_CDNS){
  statusEl.textContent = `loading the 3D engine · ${name}`;
  try {
    const mod = await Promise.race([
      import(url),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timed out after 10s')), 10000)),
    ]);
    if (mod && mod.Vector3 && mod.WebGLRenderer){ THREE = mod; break; }
    throw new Error('module loaded but contents look wrong');
  } catch (err){ failures.push(`${name} — ${(err && err.message) || err}`); }
}
renderSteps(1, !THREE);
if (!THREE){ showBootFailure(failures); throw new Error('engine load failed'); }
window.THREE = THREE;

const FILES = [
  ['sv-world.js',     () => window.SV && SV.GEO && SV.store && SV.renderer],
  ['sv-entities.js',  () => window.SV && SV.ent],
  ['sv-systems.js',   () => window.SV && SV.sys],
  ['sv-ui.js',        () => window.SV && SV.ui],
  ['sv-main.js',      () => window.SV && SV.main],
];
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error('file not found or unreadable — is it in the same folder as index.html?'));
    document.head.appendChild(s);
  });
}
for (let i = 0; i < FILES.length; i++){
  const [file, check] = FILES[i];
  statusEl.textContent = `building ${STEPS[i + 1]} · ${file}`;
  bootErr = null;
  try { await loadScript(file); }
  catch (err){ renderSteps(i + 1, true); showBootFailure([`${file} — ${err.message}`]); throw new Error(file); }
  if (!check()){ renderSteps(i + 1, true); showBootFailure([`${file} — loaded but crashed: ${bootErr || 'see console (F12)'}`]); throw new Error(file); }
  renderSteps(i + 2, false);
}
statusEl.textContent = 'opening the valley…';
try { SV.main.start(); }
catch (err){ showBootFailure(['start — ' + ((err && err.message) || err)]); throw err; }

// after boot: any runtime error shows as a small toast instead of a silent dark screen
window.addEventListener('error', (e) => {
  const t = document.getElementById('svToast');
  if (!t) return;
  t.textContent = '⚠ ' + (e.message || 'runtime error');
  t.style.display = 'block';
  clearTimeout(window.__svToastT);
  window.__svToastT = setTimeout(() => (t.style.display = 'none'), 6000);
});
</script>
